<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hisaab: an agentic personal finance coach</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f6f8; --card:#fff; --ink:#18202b; --ink2:#4a5566; --ink3:#7b8696; --line:#e3e7ee;
  --brand:#0f5b52; --brand2:#127a6d; --brandSoft:#e3f2ef; --warn:#b45309; --warnSoft:#fff4e5;
  --bad:#b42318; --badSoft:#fdecea; --good:#067647; --goodSoft:#e6f6ee; --info:#1d4ed8; --infoSoft:#e8efff;
  --radius:10px; --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
header{background:#0c2b28;color:#fff;padding:10px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
header .logo{font-weight:700;font-size:17px;letter-spacing:.2px}
header .logo span{color:#7fe0cf}
header .tag{color:#b9d6d1;font-size:12.5px}
header .spacer{flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:500;white-space:nowrap}
.chip.dark{background:rgba(255,255,255,.1);color:#dff3ef}
.dot{width:7px;height:7px;border-radius:50%;background:#999;display:inline-block}
.dot.on{background:#3ddc97}.dot.off{background:#f97066}.dot.wait{background:#fdb022}
.layout{display:grid;grid-template-columns:200px minmax(0,1fr) 340px;gap:0;min-height:calc(100vh - 52px)}
nav{background:#fff;border-right:1px solid var(--line);padding:12px 8px}
nav button{display:flex;width:100%;align-items:center;gap:8px;border:0;background:none;padding:9px 12px;border-radius:8px;cursor:pointer;color:var(--ink2);font-weight:500;text-align:left}
nav button:hover{background:#f1f4f7}
nav button.active{background:var(--brandSoft);color:var(--brand)}
nav .num{width:20px;height:20px;border-radius:6px;background:#eef1f5;color:var(--ink3);font-size:11px;display:inline-flex;align-items:center;justify-content:center;font-weight:600}
nav button.active .num{background:var(--brand);color:#fff}
nav .badge{margin-left:auto;background:var(--warn);color:#fff;border-radius:999px;font-size:11px;padding:0 7px}
main{padding:18px 22px 60px;min-width:0}
aside{background:#0f1720;color:#d5dde7;border-left:1px solid #1f2a36;display:flex;flex-direction:column;max-height:calc(100vh - 52px);position:sticky;top:0}
aside .ah{padding:12px 14px;border-bottom:1px solid #1f2a36;display:flex;align-items:center;gap:8px}
aside .ah b{color:#fff}
aside .ah small{color:#8b98a8;white-space:nowrap}
aside .tl{overflow:auto;padding:8px 10px;flex:1;font-size:12.3px}
.tr{border-left:2px solid #2b3846;padding:4px 0 8px 10px;margin-left:4px;position:relative}
.tr .k{font-size:10.5px;font-weight:700;letter-spacing:.5px;padding:1px 6px;border-radius:4px;margin-right:6px}
.tr.plan .k{background:#1e3a5f;color:#9cc4ff}.tr.tool .k{background:#3b2f12;color:#ffd27a}.tr.result .k{background:#173b2f;color:#7fe0b4}
.tr.guard .k{background:#4a1d1d;color:#ffb3ad}.tr.action .k{background:#2c2357;color:#c6b8ff}.tr.final .k{background:#20323a;color:#bfe9ff}
.tr.info .k{background:#26303c;color:#c3cdd9}.tr.error .k{background:#5b1a1a;color:#ffc9c4}
.tr .t{color:#7d8a9b;font-size:10.5px;float:right}
.tr pre{margin:4px 0 0;white-space:pre-wrap;word-break:break-word;color:#aeb9c7;font:11.3px/1.4 ui-monospace,Menlo,Consolas,monospace;background:#151f2a;padding:6px 7px;border-radius:6px;max-height:160px;overflow:auto}
h1{font-size:21px;margin:2px 0 4px}
h2{font-size:16px;margin:0 0 10px}
h3{font-size:14px;margin:0 0 8px}
.sub{color:var(--ink3);margin:0 0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:14px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.kpi .l{color:var(--ink3);font-size:12px;font-weight:500}
.kpi .v{font-size:21px;font-weight:700;margin-top:2px}
.kpi .s{font-size:12px;color:var(--ink3)}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 12px;cursor:pointer;font-weight:500}
.btn:hover{background:#f6f8fa}
.btn.p{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.p:hover{background:var(--brand2)}
.btn.s{padding:4px 9px;font-size:12.5px}
.btn.ghost{border-color:transparent;background:transparent}
.btn:disabled{opacity:.55;cursor:not-allowed}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.muted{color:var(--ink3)}
.small{font-size:12.5px}
table{width:100%;border-collapse:collapse}
th{font-size:12px;color:var(--ink3);font-weight:600;text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:7px 8px;border-bottom:1px solid #f0f2f5;vertical-align:middle}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr.flag td{background:#fffaf0}
.pill{display:inline-block;padding:1px 8px;border-radius:999px;font-size:11.5px;font-weight:600}
.pill.g{background:var(--goodSoft);color:var(--good)}.pill.w{background:var(--warnSoft);color:var(--warn)}.pill.b{background:var(--badSoft);color:var(--bad)}.pill.i{background:var(--infoSoft);color:var(--info)}.pill.n{background:#eef1f5;color:var(--ink2)}
.nudge{display:flex;gap:10px;padding:10px 12px;border-radius:8px;margin-bottom:8px;align-items:flex-start}
.nudge.warn{background:var(--warnSoft)}.nudge.bad{background:var(--badSoft)}.nudge.info{background:var(--infoSoft)}.nudge.good{background:var(--goodSoft)}
.nudge .ic{font-weight:700;font-size:12px;border-radius:6px;padding:1px 7px;color:#fff;margin-top:2px;white-space:nowrap}
.nudge.warn .ic{background:var(--warn)}.nudge.bad .ic{background:var(--bad)}.nudge.info .ic{background:var(--info)}.nudge.good .ic{background:var(--good)}
.nudge .x{margin-left:auto}
input[type=text],input[type=number],input[type=date],select,textarea{border:1px solid #d0d6df;border-radius:8px;padding:7px 9px;background:#fff;width:100%}
textarea{min-height:120px;resize:vertical;font:12.5px/1.45 ui-monospace,Menlo,Consolas,monospace}
select.cat{padding:3px 6px;font-size:12.5px;width:auto;max-width:170px}
label.f{display:block;font-size:12px;color:var(--ink3);font-weight:600;margin-bottom:4px}
.drop{border:2px dashed #c9d2dd;border-radius:10px;padding:20px;text-align:center;color:var(--ink3);background:#fafbfc}
.drop.over{border-color:var(--brand);background:var(--brandSoft)}
.chat{display:flex;flex-direction:column;gap:10px;max-height:56vh;overflow:auto;padding:4px}
.msg{max-width:86%;padding:10px 13px;border-radius:12px;white-space:pre-wrap;word-break:break-word}
.msg.u{align-self:flex-end;background:var(--brand);color:#fff;border-bottom-right-radius:4px}
.msg.a{align-self:flex-start;background:#fff;border:1px solid var(--line);border-bottom-left-radius:4px}
.msg.a.guard{border-color:#f2b8b5;background:#fff8f7}
.sugg{display:flex;flex-wrap:wrap;gap:6px}
.sugg button{border:1px solid #cfe3df;background:#f3faf8;color:var(--brand);border-radius:999px;padding:4px 11px;cursor:pointer;font-size:12.5px}
.bar{height:9px;background:#eef1f5;border-radius:6px;position:relative;overflow:visible}
.bar i{display:block;height:100%;border-radius:6px;background:var(--brand2)}
.bar i.w{background:#f79009}.bar i.b{background:#f04438}
.bar .pace{position:absolute;top:-3px;width:2px;height:15px;background:#344054}
.slider{display:grid;grid-template-columns:150px 1fr 70px;gap:10px;align-items:center;margin:8px 0}
input[type=range]{width:100%;accent-color:var(--brand)}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#101828;color:#fff;padding:9px 16px;border-radius:8px;opacity:0;transition:.25s;pointer-events:none;z-index:50;max-width:90vw}
#toast.show{opacity:1}
#modal{position:fixed;inset:0;background:rgba(16,24,40,.45);display:none;align-items:center;justify-content:center;z-index:40}
#modal.show{display:flex}
#modal .box{background:#fff;border-radius:12px;padding:18px;max-width:520px;width:92vw;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.review{white-space:pre-wrap;line-height:1.6}
.verify{padding:8px 12px;border-radius:8px;font-size:12.5px;margin-top:10px}
.verify.ok{background:var(--goodSoft);color:var(--good)}.verify.bad{background:var(--warnSoft);color:var(--warn)}
.empty{text-align:center;padding:30px 10px;color:var(--ink3)}
.spin{display:inline-block;width:12px;height:12px;border:2px solid #cfd6df;border-top-color:var(--brand);border-radius:50%;animation:sp 0.8s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
mark.unv{background:#fde68a;border-radius:3px;padding:0 2px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--ink3)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
@media (max-width:1180px){.layout{grid-template-columns:180px minmax(0,1fr)} aside{grid-column:1/-1;max-height:none;position:static}}
@media (max-width:760px){.layout{grid-template-columns:1fr} nav{display:flex;overflow:auto;border-right:0;border-bottom:1px solid var(--line)} nav button{width:auto;white-space:nowrap} .g2,.g3,.g4{grid-template-columns:1fr} .slider{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <div class="logo">Hisaab<span>.</span></div>
  <div class="tag">an agentic finance coach with a living money model</div>
  <div class="spacer"></div>
  <span class="chip dark" id="aiChip"><span class="dot wait"></span>AI: checking</span>
  <span class="chip dark" id="storeChip"><span class="dot wait"></span>Storage: checking</span>
  <button class="btn s" id="settingsBtn" style="background:transparent;color:#dff3ef;border-color:#2c5a54">Settings</button>
</header>
<div class="layout">
  <nav id="nav"></nav>
  <main id="main"></main>
  <aside>
    <div class="ah"><b>Agent trace</b><small>live: plans, tool calls, actions</small><span style="flex:1"></span><button class="btn s ghost" style="color:#8b98a8" id="clearTrace">Clear</button></div>
    <div class="tl" id="trace"></div>
  </aside>
</div>
<div id="modal"><div class="box" id="modalBox"></div></div>
<div id="toast"></div>
<script>
"use strict";
/* ============================================================
   Hisaab: agentic personal finance coach (single-file app)
   ============================================================ */
const SAMPLE_CSV = __SAMPLE_CSV__;
const SAMPLE_SMS = __SAMPLE_SMS__;

/* ---------- small utilities ---------- */
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const inr = (n, dp=0) => (n < 0 ? '−' : '') + '₹' + Math.abs(Number(n)||0).toLocaleString('en-IN', {maximumFractionDigits:dp, minimumFractionDigits:dp});
const pct = (n, dp=0) => (Number.isFinite(n) ? n.toFixed(dp) : '0') + '%';
const uid = () => Math.random().toString(36).slice(2, 10);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const round = (n, to=1) => Math.round(n / to) * to;
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const monthKey = d => d.slice(0, 7);
const monthLabel = k => { const [y, m] = k.split('-'); return MONTHS[+m - 1] + ' ' + y; };
const daysIn = k => { const [y, m] = k.split('-').map(Number); return new Date(y, m, 0).getDate(); };
const addMonths = (k, n) => { let [y, m] = k.split('-').map(Number); m += n; while (m > 12) { m -= 12; y++; } while (m < 1) { m += 12; y--; } return y + '-' + String(m).padStart(2, '0'); };
const fmtDate = d => { if (!d) return ''; const [y, m, dd] = d.split('-'); return +dd + ' ' + MONTHS[+m - 1] + ' ' + y; };
const median = a => { if (!a.length) return 0; const s = [...a].sort((x, y) => x - y); const h = Math.floor(s.length / 2); return s.length % 2 ? s[h] : (s[h - 1] + s[h]) / 2; };
const sum = a => a.reduce((x, y) => x + y, 0);
function withTimeout(p, ms) { return Promise.race([p, new Promise(r => setTimeout(() => r(null), ms))]); }
function lsGet(k) { try { return localStorage.getItem(k); } catch { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); return true; } catch { return false; } }
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 2600); }

/* ---------- categories ---------- */
const CATS = ['Income','Other income','Rent','Groceries','Food delivery','Dining out','Transport','Fuel','Shopping','Subscriptions','Mobile & Internet','Utilities','Health','Home & services','Entertainment','Travel','Education','Insurance','EMI/Loan','Investments','Cash withdrawal','Transfers','Card payment','Fees & charges','Other'];
const NOT_SPEND = new Set(['Income','Other income','Investments','Card payment']);
const FIXED = new Set(['Rent','Subscriptions','Mobile & Internet','Utilities','Insurance','EMI/Loan','Education']);
const ESSENTIAL = new Set(['Rent','Groceries','Utilities','Mobile & Internet','Transport','Health','Insurance','EMI/Loan','Fuel']);
const VARIABLE = CATS.filter(c => !NOT_SPEND.has(c) && !FIXED.has(c));
// ordered: more specific first (e.g. JIOHOTSTAR before JIO, PRIME VIDEO before AMAZON)
const KEYWORDS = [
  ['Subscriptions', ['NETFLIX','SPOTIFY','PRIME VIDEO','AMAZON PRIME','JIOHOTSTAR','HOTSTAR','SONYLIV','ZEE5','YOUTUBE PREMIUM','YOUTUBEPREMIUM','APPLE.COM','GOOGLE PLAY','CULTFIT','CULT.FIT','CULTPASS','AUDIBLE','LINKEDIN PREMIUM','CHATGPT','OPENAI']],
  ['Income', ['SALARY','PAYROLL','SAL CR']],
  ['Rent', [' RENT ','RENTAL','NOBROKER RENT']],
  ['Investments', ['MF SIP','SIP ','MUTUAL FUND','ZERODHA','GROWW','KUVERA','ICCL','PPF','NPS ']],
  ['Food delivery', ['SWIGGY','ZOMATO','EATSURE']],
  ['Groceries', ['BLINKIT','ZEPTO','BIGBASKET','DMART','INSTAMART','JIOMART','RATNADEEP','NATURES BASKET','MORE RETAIL']],
  ['Dining out', ['RESTAURANT','CAFE','COFFEE','BREWPUB','BREW','TIFFIN','DHABA','BAKERY','PIZZA','STARBUCKS','MCDONALD','KFC','BURGER']],
  ['Transport', ['UBER','OLA ','OLACABS','RAPIDO','METRO','BMRCL','NAMMA YATRI','FASTAG']],
  ['Fuel', ['HPCL','IOCL','BPCL','PETROL','INDIAN OIL','SHELL ']],
  ['Mobile & Internet', ['AIRTEL','JIO ','JIO PREPAID','VODAFONE','VI POSTPAID','BSNL','ACT FIBERNET','HATHWAY','EXCITEL']],
  ['Utilities', ['BESCOM','ELECTRICITY','TATA POWER','ADANI ELEC','BWSSB','WATER BILL','INDANE','HP GAS','PIPED GAS']],
  ['Health', ['APOLLO','PHARMACY','PHARMEASY','1MG','MEDPLUS','HOSPITAL','CLINIC','DIAGNOSTIC','PRACTO']],
  ['Travel', ['MAKEMYTRIP','GOIBIBO','IRCTC','INDIGO','AIR INDIA','CLEARTRIP','OYO','AIRBNB','REDBUS']],
  ['Entertainment', ['BOOKMYSHOW','PVR','INOX']],
  ['Insurance', ['INSURANCE','LIC ','POLICYBAZAAR','ACKO']],
  ['EMI/Loan', [' EMI','LOAN','BAJAJ FIN']],
  ['Cash withdrawal', ['ATM CASH','NWD-','CASH WDL','ATM ']],
  ['Card payment', ['CC PAYMENT','CREDIT CARD PAYMENT','CRED CLUB']],
  ['Fees & charges', ['CHARGES','ANNUAL FEE','PENALTY','GST ON']],
  ['Shopping', ['AMAZON','FLIPKART','MYNTRA','AJIO','NYKAA','MEESHO','DECATHLON','CROMA','IKEA']],
  ['Education', ['COURSERA','UDEMY','UNACADEMY','SCHOOL FEE','COLLEGE']],
];
const OTT = ['NETFLIX','PRIME VIDEO','JIOHOTSTAR','HOTSTAR','SONYLIV','ZEE5','YOUTUBE PREMIUM'];

/* ---------- state ---------- */
const freshState = () => ({
  version: 1, txns: [], rules: [],
  profile: { incomeOverride: null, emergencyFund: 120000, emergencyMonths: 6, goals: [], budgets: {}, name: '', age: 27 },
  subFlags: {}, agentNudges: [], dismissed: {}, reviews: {}, chat: [], log: [], future: null, futureChat: []
});
let S = freshState();
const RT = { tab: 'home', trace: [], busy: false, filter: { month: 'all', cat: 'all', q: '', review: false }, pending: null,
  whatif: { cuts: { 'Food delivery': 0, 'Dining out': 0, 'Shopping': 0 }, rentDelta: 0, incomePct: 0, cancel: {} }, lastAgentScenario: null, reviewMonth: null, ver: 0, replay: null, replayData: null, downloads: null, futureSelf: 'plan', tts: null, dict: null, listening: false, autoVoice: false };

/* ---------- storage: Claude per-user db → localStorage → memory ---------- */
const Store = {
  mode: 'memory', ref: null, chain: Promise.resolve(), timer: null,
  async init() {
    try {
      if (window.claude && typeof window.claude.use === 'function') {
        const db = await withTimeout(window.claude.use('db'), 10000);
        const user = db ? await withTimeout(window.claude.use('user'), 10000) : null;
        if (db && user) {
          const id = await user.id();
          this.ref = db.collection('data/users/' + id).doc('hisaab');
          const got = await withTimeout(this.ref.get(), 10000);
          const val = got && typeof got.data === 'function' ? got.data() : got;
          if (val && val.state && !S.txns.length) { try { S = Object.assign(freshState(), JSON.parse(val.state)); } catch {} }
          this.mode = 'cloud'; return;
        }
      }
    } catch (e) { console.warn('db unavailable', e); }
    const raw = lsGet('hisaab_state_v1');
    if (raw !== null || lsSet('hisaab_probe', '1')) {
      this.mode = 'browser';
      if (raw && !S.txns.length) { try { S = Object.assign(freshState(), JSON.parse(raw)); } catch {} }
    }
  },
  save() {
    RT.ver++;
    clearTimeout(this.timer);
    this.timer = setTimeout(() => {
      const json = JSON.stringify(S);
      if (this.mode === 'cloud' && this.ref) {
        this.chain = this.chain.then(() => this.ref.set({ state: json, savedAt: new Date().toISOString() })).catch(e => { console.warn(e); lsSet('hisaab_state_v1', json); });
      } else if (this.mode === 'browser') lsSet('hisaab_state_v1', json);
    }, 700);
  }
};

/* ---------- AI: Claude (in claude.ai) → Anthropic API key (standalone) → off ---------- */
const AI = {
  mode: 'checking', sample: null,
  async init() {
    try {
      if (window.claude && typeof window.claude.use === 'function') {
        const s = await withTimeout(window.claude.use('sample'), 10000);
        if (s) { this.sample = s; this.mode = 'claude'; renderChips(); return; }
      }
    } catch (e) { console.warn('sample unavailable', e); }
    this.mode = lsGet('hisaab_api_key') ? 'anthropic' : 'off';
    renderChips();
  },
  get on() { return this.mode === 'claude' || this.mode === 'anthropic'; },
  async api(body) {
    const r = await fetch('https://api.anthropic.com/v1/messages', { method: 'POST', headers: {
      'content-type': 'application/json', 'x-api-key': lsGet('hisaab_api_key') || '', 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true' },
      body: JSON.stringify(Object.assign({ model: lsGet('hisaab_model') || 'claude-sonnet-5-5', max_tokens: 1800 }, body)) });
    if (!r.ok) throw new Error('API ' + r.status + ': ' + (await r.text()).slice(0, 180));
    return r.json();
  },
  async json(prompt, tier = 'quick') {
    if (this.mode === 'claude') {
      if (typeof this.sample.json === 'function') return await this.sample.json(prompt, { modelTier: tier });
      const r = await this.sample(prompt, { modelTier: tier }); return parseJSONLoose(r.text);
    }
    if (this.mode === 'anthropic') {
      const r = await this.api({ messages: [{ role: 'user', content: prompt + '\n\nReturn only JSON.' }] });
      return parseJSONLoose(r.content.filter(b => b.type === 'text').map(b => b.text).join(''));
    }
    throw new Error('AI is off');
  },
  async text(prompt, tier = 'default') {
    if (this.mode === 'claude') { const r = await this.sample(prompt, { modelTier: tier, cache: false }); return r.text; }
    if (this.mode === 'anthropic') { const r = await this.api({ messages: [{ role: 'user', content: prompt }] }); return r.content.filter(b => b.type === 'text').map(b => b.text).join(''); }
    throw new Error('AI is off');
  },
  // agent loop: the model plans, picks tools, we execute them, it continues until done
  async agent(messages, tools, onText) {
    if (this.mode === 'claude') {
      const r = await this.sample(messages, { modelTier: 'default', cache: false,
        tools: tools.map(t => ({ name: t.name, description: t.description, inputSchema: t.schema, execute: t.run })),
        onText: ({ text }) => onText && onText(text) });
      return r.text;
    }
    if (this.mode === 'anthropic') {
      const msgs = messages.map(m => ({ role: m.role, content: m.content }));
      const defs = tools.map(t => ({ name: t.name, description: t.description, input_schema: t.schema }));
      for (let step = 0; step < 8; step++) {
        const r = await this.api({ messages: msgs, tools: defs });
        msgs.push({ role: 'assistant', content: r.content });
        const uses = r.content.filter(b => b.type === 'tool_use');

/* ---------- PII masking (before anything goes to the model) ---------- */

  return String(s)

/* CSV: find the header row, map the columns, parse rows; ask the model only if the layout is unrecognisable */
async function parseCSV(text) {

    const c = splitCSV(lines[i]).map(x => x.toLowerCase());
    if (c.some(x => /date/.test(x)) && c.some(x => /narration|description|particular|remark|details/.test(x))) { hi = i; cols = c; break; }
  }

  }

    if (!AI.on) throw new Error('Could not recognise this CSV layout. Turn AI on so the agent can map the columns.');
    trace('plan', 'CSV layout not recognised. Asking the model to map the columns (only the first 8 lines are sent, masked).');
    const head = lines.filter(l => l.trim()).slice(0, 8).map(maskPII).join('\n');
    const r = await AI.json(`You map bank-statement CSV columns. Lines (0-indexed, non-empty only):\n${head}\n\nReturn JSON {"headerRow":n,"date":i,"desc":i,"debit":i,"credit":i,"amount":i,"type":i} using column indexes, -1 if absent.`);
    trace('result', 'Column map from model', r);

  }

    const desc = c[map.desc] || '';

    const dr = parseAmount(c[map.debit]), cr = parseAmount(c[map.credit]);

/* ---------- categorisation: learned rules → keyword rules → model for unknown payees ---------- */

  let res = [];

    res = await AI.json(`You categorise payees from an Indian bank account. Allowed categories: ${CATS.filter(c => c !== 'Income').join(', ')}.

/* ---------- import pipeline (the agent runs these steps on its own) ---------- */

  trace('plan', `New ${label}. Plan: parse → extract messy lines → mask personal data → de-duplicate → categorise → rebuild money model → check for nudges.`);
  try {
    let r;
    if (kind === 'csv') r = await parseCSV(payload);
    else if (kind === 'sms') r = await parseSMS(payload);
    else if (kind === 'pdf') { const lines = await pdfToLines(payload); trace('result', `Read ${lines.length} text lines from the PDF.`); r = await parseStatementText(lines); }

    trace('result', `Parsed ${r.txns.length} transaction(s) with rules; ignored ${r.skipped} line(s) (headers, OTPs, offers); ${r.unparsed.length} need the model.`);
    const extra = await aiExtract(r.unparsed, kind);
    let all = r.txns.concat(extra);
    const seen = new Set(S.txns.map(t => t.date + '|' + t.amount + '|' + t.merchant));
    const fresh = all.filter(t => !seen.has(t.date + '|' + t.amount + '|' + t.merchant));
    if (fresh.length < all.length) trace('info', `Skipped ${all.length - fresh.length} duplicate(s) already in your history.`);
    await categorise(fresh);
    S.txns = S.txns.concat(fresh).sort((a, b) => a.date.localeCompare(b.date));
    S.log.push({ at: new Date().toISOString(), label, added: fresh.length });
    ensureDefaults();
    Store.save();
    const M = model();
    trace('action', `Added ${fresh.length} transaction(s). Money model rebuilt: ${M.recurring.length} recurring payment(s), ${M.nudges.length} nudge(s).`);
    toast(`Imported ${fresh.length} transactions`);
  } catch (e) { trace('error', e.message || String(e)); toast(e.message || 'Import failed'); }
  RT.busy = false; render();
}
function ensureDefaults() {
  const M = model(true);
  for (const c of VARIABLE) if (S.profile.budgets[c] == null && (M.avgCat[c] || 0) > 0) S.profile.budgets[c] = Math.max(500, Math.ceil(M.avgCat[c] / 500) * 500);
  if (!S.profile.goals.length && S.txns.length > 30) {
    const base = M.latest;
    S.profile.goals.push({ id: uid(), name: 'Goa trip', target: 30000, saved: 12000, by: addMonths(base, 4) + '-28' });

    ${M.goals.map(g => `<tr><td><b>${esc(g.name)}</b></td><td class="n">${inr(g.target)}</td><td class="n">${inr(g.saved)}</td><td>${fmtDate(g.by)}</td><td class="n">${inr(g.required)}</td><td>${g.remaining <= 0 ? '<span class="pill g">done</span>' : g.onTrack ? '<span class="pill g">on track</span>' : `<span class="pill w">late: ${g.eta ? monthLabel(g.eta) : 'never'}</span>`}</td><td>${g.auto ? '<span class="small muted">auto</span>' : `<button class="btn s ghost" data-act="delGoal" data-id="${g.id}">✕</button>`}</td></tr>`).join('')}</table>
    <div class="row" style="margin-top:10px"><input type="text" id="gName" placeholder="Goal" style="max-width:130px"><input type="number" id="gT" placeholder="Target ₹" style="max-width:110px"><input type="number" id="gS" placeholder="Saved ₹" style="max-width:100px"><input type="date" id="gBy" style="max-width:150px"><button class="btn p s" data-act="addGoal">Add</button></div>
    <p class="small muted">Money left after SIPs funds goals in deadline order, soonest first; anything spare goes to the last goal.</p></div>
  </div>
  <div class="card"><h2>Monthly budgets</h2><p class="small muted">Suggested from your average. Nudges fire when spending runs ahead of the month's pace.</p><table><tr><th>Category</th><th class="n">Average</th><th class="n">This month</th><th style="width:160px">Budget</th></tr>
  ${VARIABLE.filter(c => M.avgCat[c] || S.profile.budgets[c]).map(c => `<tr><td>${c}</td><td class="n">${inr(M.avgCat[c] || 0)}</td><td class="n">${inr((M.catByMonth[M.latest] || {})[c] || 0)}</td><td><input type="number" class="bud" data-c="${c}" value="${S.profile.budgets[c] || ''}"></td></tr>`).join('')}</table></div>`;
}
function vWhatIf(M) {
  if (!S.txns.length) return '<h1>What-if planner</h1>' + emptyState();
  const w = RT.whatif; const changes = [];
  for (const [c, v] of Object.entries(w.cuts)) if (v) changes.push({ kind: 'cut_category_pct', category: c, pct: v });
  if (w.rentDelta) changes.push({ kind: 'change_rent', amount: w.rentDelta });
  if (w.incomePct) changes.push({ kind: 'change_income_pct', pct: w.incomePct });
  for (const [m, v] of Object.entries(w.cancel)) if (v) changes.push({ kind: 'cancel_subscription', merchant: m });
  const r = simulate(changes); const subs = M.recurring.filter(x => x.kind === 'subscription');
  const sl = (id, label, val, min, max, step, fmt) => `<div class="slider"><label class="small">${label}</label><input type="range" id="${id}" min="${min}" max="${max}" step="${step}" value="${val}"><b class="small">${fmt(val)}</b></div>`;
  const ag = RT.lastAgentScenario;
  return `<h1>What-if planner</h1><p class="sub">Move the sliders, or ask the coach in plain words ("what if my rent goes up by ₹3,000?"). Code does the maths, so answers are exact and repeatable.</p>
  <div class="grid g2"><div class="card"><h2>Change something</h2>
   ${Object.keys(w.cuts).map(c => sl('cut_' + c.replace(/\W/g, ''), 'Cut ' + c.toLowerCase(), w.cuts[c], 0, 60, 5, v => v + '%')).join('')}
   ${sl('rentD', 'Rent change', w.rentDelta, -5000, 10000, 500, v => (v >= 0 ? '+' : '−') + inr(Math.abs(v)))}
   ${sl('incP', 'Income change', w.incomePct, -30, 40, 5, v => (v >= 0 ? '+' : '') + v + '%')}
   <div class="small" style="margin-top:8px"><b>Cancel subscriptions:</b> ${subs.map(s => `<label style="margin-right:10px"><input type="checkbox" class="cx" data-m="${esc(s.merchant)}" ${w.cancel[s.merchant] ? 'checked' : ''}> ${esc(title(s.merchant))} (${inr(s.monthly)})</label>`).join('')}</div>
   <div class="row" style="margin-top:12px"><input type="text" id="wiAsk" placeholder="Or ask: what if I cut dining out by 30%?"><button class="btn p" data-act="wiAsk">Ask agent</button></div></div>
   <div class="card"><h2>Result</h2>
   <div class="grid g3">${kpi('Monthly surplus', inr(r.scen.surplus), (r.deltaMonthly >= 0 ? '+' : '') + inr(r.deltaMonthly) + ' vs now')}${kpi('Savings rate', pct(r.scen.rate), 'now ' + pct(r.base.rate))}${kpi('Extra per year', inr(r.deltaYearly), '')}</div>
   ${chartSavings(r)}
   <table><tr><th>Goal</th><th>Now reaches</th><th>Then reaches</th></tr>${r.goals.map(g => `<tr><td>${esc(g.name)}</td><td>${g.baseEta ? monthLabel(g.baseEta) : 'never'}</td><td><b>${g.newEta ? monthLabel(g.newEta) : 'never'}</b> ${g.onTrack ? '<span class="pill g">on time</span>' : '<span class="pill w">late</span>'}</td></tr>`).join('')}</table></div></div>
  ${ag ? `<div class="card"><h2>Last scenario the agent ran</h2><p class="small">${ag.result.applied.map(esc).join(' · ') || 'no changes'}</p><p class="small">Surplus ${inr(ag.result.base.surplus)} → <b>${inr(ag.result.scen.surplus)}</b>/month (${inr(ag.result.deltaYearly)} a year).</p></div>` : ''}`;
}
function chartSavings(r) {
  const W = 520, H = 150, P = 34; const n = 12; const a = [], b = [];
  for (let i = 0; i <= n; i++) { a.push(Math.max(0, r.base.surplus) * i); b.push(Math.max(0, r.scen.surplus) * i); }
  const mx = Math.max(1, ...a, ...b); const x = i => P + i * (W - P - 8) / n, y = v => H - 18 - v / mx * (H - 30);
  const path = arr => arr.map((v, i) => (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(v).toFixed(1)).join(' ');
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;margin:8px 0" role="img" aria-label="Cumulative savings over 12 months">
  <line x1="${P}" y1="${H - 18}" x2="${W - 8}" y2="${H - 18}" stroke="#d0d6df"/><text x="${P}" y="12" font-size="10.5" fill="#7b8696">Cumulative savings, next 12 months</text>
  <path d="${path(a)}" fill="none" stroke="#98a2b3" stroke-width="2" stroke-dasharray="4 4"/><path d="${path(b)}" fill="none" stroke="#127a6d" stroke-width="2.5"/>
  <text x="${x(n) - 2}" y="${y(b[n]) - 6}" text-anchor="end" font-size="11" font-weight="600" fill="#0f5b52">${inr(b[n])}</text><text x="${x(n) - 2}" y="${y(a[n]) + 14}" text-anchor="end" font-size="10.5" fill="#7b8696">now: ${inr(a[n])}</text>
  ${[0, 3, 6, 9, 12].map(i => `<text x="${x(i)}" y="${H - 4}" text-anchor="middle" font-size="10" fill="#7b8696">${i}m</text>`).join('')}</svg>`;
}
function vReview(M) {
  if (!S.txns.length) return '<h1>Monthly review</h1>' + emptyState();
  const k = RT.reviewMonth || M.full[M.full.length - 1] || M.latest; const rv = S.reviews[k];
  let body = '';
  if (rv) {
    let html = esc(rv.text); const bad = (rv.checks || []).filter(c => !c.ok).map(c => c.raw);
    for (const b of [...new Set(bad)]) html = html.split(esc(b)).join(`<mark class="unv" title="Not found in the computed facts">${esc(b)}</mark>`);
    const ok = (rv.checks || []).filter(c => c.ok).length, tot = (rv.checks || []).length;
    body = `<div class="card"><div class="row" style="justify-content:space-between"><h2>${monthLabel(k)} review</h2><span class="pill ${rv.by === 'ai' ? 'i' : 'n'}">${rv.by === 'ai' ? 'written by AI from computed facts' : 'template (AI off)'}</span></div><div class="review">${html}</div>
    <div class="verify ${bad.length ? 'bad' : 'ok'}">${bad.length ? `Figure check: ${bad.length} of ${tot} figures are not in the computed facts and are highlighted. Treat them with care.` : `Figure check passed: all ${tot} ₹ and % figures match the numbers computed from your transactions.`}</div>
    <div class="row" style="margin-top:10px"><button class="btn s" data-act="copyReview" data-k="${k}">Copy as text</button></div></div>
    <div class="card"><h3>Facts the review was built from</h3><table><tr><th>Category</th><th class="n">Spent</th><th class="n">Budget</th><th class="n">Previous month</th></tr>${rv.facts.topCategories.map(c => `<tr><td>${c.category}</td><td class="n">${inr(c.spent)}</td><td class="n">${c.budget ? inr(c.budget) : '–'}</td><td class="n">${c.prevMonth != null ? inr(c.prevMonth) : '–'}</td></tr>`).join('')}</table><p class="small muted">Income ${inr(rv.facts.income)} · spend ${inr(rv.facts.spend)} · saved ${inr(rv.facts.saved)} (${rv.facts.savingsRatePct}%) · invested ${inr(rv.facts.invested)}</p></div>`;
  }
  return `<h1>Monthly review</h1><p class="sub">Code computes every number; the AI writes the story; code then checks that each ₹ and % in the story exists in the facts, a simple guard against made-up numbers.</p>
  <div class="card row"><select id="rvM" style="width:auto">${M.months.map(x => `<option value="${x}" ${x === k ? 'selected' : ''}>${monthLabel(x)}${x === M.latest && !M.full.includes(x) ? ' (in progress)' : ''}</option>`).join('')}</select><button class="btn p" data-act="genReview" ${RT.busy ? 'disabled' : ''}>${RT.busy ? '<span class="spin"></span> Working' : rv ? 'Regenerate' : 'Generate review'}</button></div>${body}`;
}
function vCoach() {
  const sug = ['Where did my money go last month?', 'What if I cut dining out and food delivery by 30%?', 'Can I afford the Goa trip on time?', 'Which subscriptions should I drop?', 'Which stock should I buy with my surplus?'];
  return `<h1>Coach</h1><p class="sub">Ask anything. The agent decides which tools to use, may act on its own (budgets, goals, nudges, rules) and shows every step in the trace. It educates and models scenarios; it never recommends specific securities.</p>
  <div class="card"><div class="chat" id="chatBox">${S.chat.length ? S.chat.map(m => `<div class="msg ${m.role === 'user' ? 'u' : 'a'} ${m.guard ? 'guard' : ''}" ${m.live ? 'id="liveMsg"' : ''}>${m.guard ? '<span class="pill b">guardrail</span>\n' : ''}${esc(m.content || (m.live ? 'Thinking…' : ''))}</div>`).join('') : '<p class="muted">Try one of the suggestions below.</p>'}</div>
  <div class="sugg" style="margin:10px 0">${sug.map(s => `<button data-ask="${esc(s)}">${esc(s)}</button>`).join('')}<button data-act="checkup" style="background:var(--brand);color:#fff;border-color:var(--brand)">Run autonomous check-up</button></div>
  <form class="row" id="chatForm"><input type="text" id="chatIn" placeholder="Ask the coach…" autocomplete="off" style="flex:1"><button class="btn p" ${RT.busy ? 'disabled' : ''}>${RT.busy ? '<span class="spin"></span>' : 'Send'}</button></form></div>`;
}
function settingsModal() {
  $('#modalBox').innerHTML = `<h2>Settings</h2><p class="small">Inside Claude, the AI runs through your Claude account and nothing is needed here. When you run this file on your own (for example from GitHub), add an Anthropic API key. It is stored only in this browser and sent only to api.anthropic.com.</p>
  <label class="f">Anthropic API key</label><input type="text" id="kIn" value="${esc(lsGet('hisaab_api_key') || '')}" placeholder="sk-ant-…">

  <div class="row" style="margin-top:14px;justify-content:flex-end"><button class="btn" data-act="closeModal">Close</button><button class="btn p" data-act="saveKey">Save</button></div>`;

function confirmModal(text, onYes) {
  $('#modalBox').innerHTML = `<p>${esc(text)}</p><div class="row" style="justify-content:flex-end"><button class="btn" data-act="closeModal">Cancel</button><button class="btn p" id="yesBtn">Yes</button></div>`;
  $('#modal').classList.add('show'); $('#yesBtn').onclick = () => { $('#modal').classList.remove('show'); onYes(); };
}

/* ---------- events ---------- */
document.addEventListener('click', async e => {
  const tb = e.target.closest('[data-tab]'); if (tb) { RT.tab = tb.dataset.tab; render(); return; }
  const ask = e.target.closest('[data-ask]'); if (ask) { askCoach(ask.dataset.ask); return; }
  const a = e.target.closest('[data-act]'); if (!a) return; const act = a.dataset.act;
  if (act === 'demo') { if (!S.profile.name) S.profile.name = 'Priya'; await runImport('csv', SAMPLE_CSV, 'Demo: HDFC statement CSV, Aug–Oct 2026'); await runImport('sms', SAMPLE_SMS, 'Demo: bank SMS, 1–20 Nov 2026'); RT.tab = 'home'; render(); }
  else if (act === 'fillSms') { $('#smsIn').value = SAMPLE_SMS; }
  else if (act === 'importSms') { const v = $('#smsIn').value; if (v.trim()) runImport('sms', v, 'Pasted SMS'); }
  else if (act === 'importText') { const v = $('#txtIn').value; if (v.trim()) runImport('text', v, 'Pasted statement text'); }
  else if (act === 'reset') confirmModal('Delete all transactions, rules, goals and chat? This cannot be undone.', () => { S = freshState(); RT.trace = []; RT.pending = null; Store.save(); renderTrace(); render(); toast('All data cleared'); });
  else if (act === 'dismiss') { S.dismissed[a.dataset.id] = true; Store.save(); render(); }
  else if (act === 'checkup') runCheckup();
  else if (act === 'learn') { const pat = ($('#rulePat').value || RT.pending.pattern).toUpperCase().trim(); learnRule(pat, RT.pending.category, 'user'); RT.pending = null; render(); toast('Rule learned'); }
  else if (act === 'noLearn') { RT.pending = null; render(); }
  else if (act === 'delRule') { S.rules = S.rules.filter(r => r.id !== a.dataset.id); Store.save(); render(); }
  else if (act === 'subFlag') { S.subFlags[a.dataset.m] = a.dataset.v; trace('action', `You told the agent ${title(a.dataset.m)} is ${a.dataset.v === 'keep' ? 'in use' : 'not used'}. Cancel list and nudges updated.`); Store.save(); render(); }
  else if (act === 'addGoal') { const n = $('#gName').value.trim(), t = +$('#gT').value, s = +$('#gS').value || 0, by = $('#gBy').value; if (!n || !t || !by) { toast('Add a name, target and date'); return; } S.profile.goals.push({ id: uid(), name: n, target: t, saved: s, by }); Store.save(); render(); }
  else if (act === 'delGoal') { S.profile.goals = S.profile.goals.filter(g => g.id !== a.dataset.id); Store.save(); render(); }
  else if (act === 'wiAsk') { const q = $('#wiAsk').value.trim(); if (q) askCoach(q); }
  else if (act === 'genReview') generateReview(RT.reviewMonth || model().full[model().full.length - 1] || model().latest);
  else if (act === 'copyReview') { try { await navigator.clipboard.writeText(S.reviews[a.dataset.k].text); toast('Copied'); } catch { toast('Copy blocked: select the text instead'); } }
  else if (act === 'exportSession') exportSession();
  else if (act === 'replay') loadReplay();
  else if (act === 'letters') writeLetters();
  else if (act === 'speakBoth') speakFuture('both');
  else if (act === 'speakOne') speakFuture(a.dataset.v);
  else if (act === 'stopVoice') { try { RT.tts && RT.tts.stop(); } catch {} }
  else if (act === 'pickSelf') { RT.futureSelf = a.dataset.v; render(); }
  else if (act === 'mic') { const d = RT.dict; if (!d) return; if (RT.listening) { d.stop().catch(() => {}); } else { d.start().catch(err => { if (err && err.code === 'not_granted') { RT.dict = null; render(); } }); } }
  else if (act === 'closeModal') $('#modal').classList.remove('show');
  else if (act === 'saveKey') { lsSet('hisaab_api_key', $('#kIn').value.trim()); lsSet('hisaab_model', $('#mIn').value.trim() || 'claude-sonnet-5-5'); if (AI.mode !== 'claude') AI.mode = $('#kIn').value.trim() ? 'anthropic' : 'off'; $('#modal').classList.remove('show'); renderChips(); toast('Saved'); }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.matches('select.cat')) {
    const tx = S.txns.find(x => x.id === t.dataset.id); if (!tx) return; const from = tx.category;
    tx.category = t.value; tx.catSource = 'user'; tx.needsReview = false; Store.save();
    trace('action', `You corrected ${title(tx.merchant)}: ${from} → ${t.value}.`);
    RT.pending = { id: tx.id, pattern: tx.merchant, category: t.value }; render(); return;
  }
  if (t.id === 'fMonth') { RT.filter.month = t.value; render(); }
  else if (t.id === 'fCat') { RT.filter.cat = t.value; render(); }
  else if (t.id === 'fRev') { RT.filter.review = t.checked; render(); }
  else if (t.id === 'rvM') { RT.reviewMonth = t.value; render(); }
  else if (t.id === 'incOv') { S.profile.incomeOverride = +t.value || null; Store.save(); render(); }
  else if (t.id === 'efIn') { S.profile.emergencyFund = +t.value || 0; Store.save(); render(); }
  else if (t.id === 'efM') { S.profile.emergencyMonths = Math.max(1, +t.value || 6); Store.save(); render(); }
  else if (t.classList.contains('bud')) { S.profile.budgets[t.dataset.c] = +t.value || 0; Store.save(); render(); }
  else if (t.classList.contains('cx')) { RT.whatif.cancel[t.dataset.m] = t.checked; render(); }
  else if (t.type === 'range') {
    const id = t.id, v = +t.value;
    if (id === 'rentD') RT.whatif.rentDelta = v; else if (id === 'incP') RT.whatif.incomePct = v;
    else for (const c of Object.keys(RT.whatif.cuts)) if ('cut_' + c.replace(/\W/g, '') === id) RT.whatif.cuts[c] = v;
    render();
  }
  else if (t.id === 'file') handleFile(t.files[0]);
  else if (t.id === 'fuName') { S.profile.name = t.value.trim(); Store.save(); render(); }
  else if (t.id === 'fuAge') { S.profile.age = Math.max(16, Math.min(80, +t.value || 27)); Store.save(); render(); }
  else if (t.id === 'autoVoice') { RT.autoVoice = t.checked; }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'fQ') { RT.filter.q = t.value; clearTimeout(RT._q); RT._q = setTimeout(() => { render(); const q = $('#fQ'); if (q) { q.focus(); q.setSelectionRange(q.value.length, q.value.length); } }, 300); }
  else if (t.type === 'range') {
    const v = +t.value; const lab = t.nextElementSibling;
    if (lab) lab.textContent = t.id === 'rentD' ? (v >= 0 ? '+' : '−') + inr(Math.abs(v)) : t.id === 'incP' ? (v >= 0 ? '+' : '') + v + '%' : v + '%';
  }
});
document.addEventListener('submit', e => { if (e.target.id === 'chatForm') { e.preventDefault(); const v = $('#chatIn').value; $('#chatIn').value = ''; askCoach(v); } if (e.target.id === 'futForm') { e.preventDefault(); const v = $('#fuIn').value; $('#fuIn').value = ''; askFuture(v); } });
document.addEventListener('dragover', e => { const d = e.target.closest && e.target.closest('#drop'); if (d) { e.preventDefault(); d.classList.add('over'); } });
document.addEventListener('dragleave', e => { const d = e.target.closest && e.target.closest('#drop'); if (d) d.classList.remove('over'); });
document.addEventListener('drop', e => { const d = e.target.closest && e.target.closest('#drop'); if (d) { e.preventDefault(); d.classList.remove('over'); handleFile(e.dataTransfer.files[0]); } });
async function handleFile(f) {
  if (!f) return;
  if (/\.pdf$/i.test(f.name) || f.type === 'application/pdf') runImport('pdf', new Uint8Array(await f.arrayBuffer()), 'PDF: ' + f.name);
  else runImport('csv', await f.text(), 'File: ' + f.name);
}
$('#settingsBtn').onclick = settingsModal;
$('#clearTrace').onclick = () => { RT.trace = []; renderTrace(); };
$('#modal').addEventListener('click', e => { if (e.target.id === 'modal') $('#modal').classList.remove('show'); });

/* ---------- boot ---------- */
(async function boot() {
  render(); renderTrace();
  await Store.init(); RT.ver++; render(); renderChips();
  AI.init();
  if (window.claude && typeof window.claude.use === 'function') {
    withTimeout(window.claude.use('downloads'), 10000).then(d => { if (d) RT.downloads = d; }).catch(() => {});
    withTimeout(window.claude.use('tts'), 10000).then(t => { if (t) { RT.tts = t; render(); } }).catch(() => {});
    withTimeout(window.claude.use('dictation'), 10000).then(d => { if (!d) return; RT.dict = d;
      d.onFinal(({ text }) => { const el = $('#fuIn'); if (el) el.value = (el.value + ' ' + text).trim(); });
      d.onState(({ state }) => { RT.listening = state === 'listening'; const b = $('#micBtn'); if (b) b.textContent = RT.listening ? 'Stop' : 'Speak'; });
      render(); }).catch(() => {});
  }
  if (!window.claude && /^https?:/.test(location.protocol)) {
    fetch('replay/session.json').then(r => r.ok ? r.json() : null).then(d => { if (d && d.kind === 'hisaab-session') { RT.replayData = d; render(); } }).catch(() => {});
  }
  if (S.txns.length) trace('info', `Loaded your saved money model: ${S.txns.length} transactions, ${S.rules.length} learned rule(s).`);
})();
